[project]
name = "hermes-temi-bridge"
version = "0.1.0"
description = "MQTT bridge between Temi Android ASR events and Hermes Agent JSON actions."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
mqtt = ["paho-mqtt>=2.1.0"]

[project.scripts]
hermes-temi-bridge = "hermes_temi_bridge.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hermes_temi_bridge"]
