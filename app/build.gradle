apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

// ---------------------------------------------------------------------------
// Load local.properties for user-specific configuration.
// Copy 'local.properties.example' to 'local.properties' to get started.
// ---------------------------------------------------------------------------
def localProps = new Properties()
def localPropsFile = rootProject.file('local.properties')
if (localPropsFile.exists()) {
    localProps.load(new FileInputStream(localPropsFile))
}

android {
    compileSdk 34

    defaultConfig {
        applicationId "com.robotemi.agent"
        minSdkVersion 23
        //noinspection ExpiredTargetSdkVersion,ExpiringTargetSdkVersion
        targetSdkVersion 30
        versionCode 1
        versionName "1.0.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // Inject config from local.properties into BuildConfig
        buildConfigField "String", "WS_SERVER_URLS",
                "\"${localProps.getProperty('ws.server.urls', 'ws://192.168.50.233:8080')}\""
        buildConfigField "String", "MQTT_BROKER_URLS",
                "\"${localProps.getProperty('mqtt.broker.urls', 'tcp://192.168.50.233:1883')}\""
        buildConfigField "String", "MQTT_CLIENT_ID",
                "\"${localProps.getProperty('mqtt.client.id', 'temi-agent')}\""
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    buildFeatures {
        buildConfig true
        viewBinding true
    }

    namespace 'com.robotemi.agent'

    lint {
        abortOnError false
    }
}

dependencies {
    // AndroidX
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.6.2'
    implementation 'androidx.core:core-ktx:1.12.0'

    // Temi SDK
    implementation 'com.robotemi:sdk:1.134.1'
    implementation 'com.google.code.gson:gson:2.10.1'

    // CameraX
    def camerax_version = "1.3.4"
    implementation "androidx.camera:camera-core:${camerax_version}"
    implementation "androidx.camera:camera-camera2:${camerax_version}"
    implementation "androidx.camera:camera-lifecycle:${camerax_version}"
    implementation "androidx.camera:camera-view:${camerax_version}"

    // OkHttp for WebSocket
    implementation "com.squareup.okhttp3:okhttp:4.12.0"

    // Eclipse Paho MQTT
    implementation "org.eclipse.paho:org.eclipse.paho.client.mqttv3:1.2.5"

    // Testing
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.5.2'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
